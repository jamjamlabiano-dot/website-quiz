<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
<title>"Guess the Country!"</title>
<style>
@font-face {
    font-family: "Super Mario 256";
    src: url(SuperMario256.ttf) format("truetype");
    font-weight: normal;
    font-style: normal;
    font-display: swap; 
}

body{
    font-family: "Super Mario 256", sans-serif;
    text-align: center;
    background-image: url();
}

.font-for-buttons1{
    font-family: "Super Mario 256", sans-serif;
    border-width: 10px;
    border-color:brown;
    background-image: url();
    background-color:brown;
    width: ;
    height: ;
    font-size: ;
}

.font-for-buttons2{
    font-family: "Super Mario 256", sans-serif;
    border-width: 10px;
    border-color: whitesmoke;
    background-image: url();
    background-color: whitesmoke;
}

.section-green{
    color: green;
    font-size: 20px;
}

.section-red{
    color:red;
    font-size: 20px;
}

.section-white{
        color:  whitesmoke;
        font-size: 20px;
}

.section-darkgreen{
        color: darkgreen;
        font-size: 20px
}

.section-darkblue{
    color: darkblue;
    font-size: 20px
}

.location-for-button1 {
    position: fixed;
    top: 10px;
    left: 10px;
}
</style>
<script>

    const quizData = [
        {
            question: "Question 1: What Flag is this?",
            correctAnswer: "Philippines",
            wrongAnswer: "USA",
            flagimage: "PH-1x1.5.png",
        },
        {
            question: "Question 2: What Flag is this?",
            correctAnswer: "USA",
            wrongAnswer: "Columbia",
            flagimage: "images.png",
        }
    ];

    let currentImageIndex = 0;
    let score = 0;

    function handleCorrect(){
        document.getElementById("gameplay-section").style.display = "none";
        document.getElementById("correct-section").style.display = "block";
        score++;
        document.getElementById("score-for-button").textContent = "Score: " + score;
    }
    function handleWrong() {
        document.getElementById("gameplay-section").style.display = "none";
        document.getElementById("wrong-section").style.display = "block";
    }

    function nextQuestion() {
        if (currentImageIndex < quizData.length - 1) {
            currentImageIndex++;
            updateGameScreen();
        document.getElementById("correct-section").style.display = "none";
        document.getElementById("wrong-section").style.display = "none";
        document.getElementById("gameplay-section").style.display = "block";
        }
        else {
            alert("Quiz Completed!");
        }
    }

    //function goBack() {
        //document.getElementById("wrong-section").style.display = "none";
        //document.getElementById("gameplay-section").style.display = "block";
    //}

    function updateGameScreen() {
        const currentData = quizData[currentImageIndex];
        document.getElementById("question-title").textContent = currentData.question;
        document.getElementById("correct-btn").textContent = currentData.correctAnswer;
        document.getElementById("wrong-btn").textContent = currentData.wrongAnswer;
        document.getElementById("flag-img").src = currentData.flagimage;
    }
</script>
</head>
<body>
<!-- SCORE SECTION -->
    <div>
    <h1 id="score-for-button">Score: 0</h1>
    </div>
<!-- END OF SCORE SECTION -->

<!-- QUESTION SECTION -->
    <div id="gameplay-section">
        <div style ="margin: 0 auto">
        <img id="flag-img" src="PH-1x1.5.png">
        </div>
        <div>
            <h1 id="question-title">Question 1: What Flag is this?</h1>
            <button id="correct-btn" onclick="handleCorrect()" class="section-white font-for-buttons1">Philippines</button>
            <button id="wrong-btn" onclick="handleWrong()" class="section-white font-for-buttons1">USA</button>
        </div> 
    </div>
<!-- END OF QUESTION SECTION -->

<!-- CORRECT PAGE SECTION -->
    <div id="correct-section" style="display: none">
        <div style="margin: 0 auto">
        <img src = "14441011.png">
        </div>
        <div class ="section-green">
        <h1>Correct!</h1>
        <button onclick="nextQuestion()" class="section-green font-for-buttons2">Proceed!</button>
        </div>
    </div>
<!-- END OF CORRECT PAGE SECTION -->

<!-- WRONG PAGE SECTION -->
    <div id="wrong-section" style="display: none">
        <div style="margin: 0 auto">
        <img src = "cancel-146131_1280.png" width="500px" height="500px">
        </div>
        <div class ="section-red">
        <h1>Wrong!</h1>
        <button onclick="nextQuestion()" class="section-red font-for-buttons2">Proceed!</button>
        </div>
    </div>
<!-- END OF WRONG PAGE SECTION -->
</body> 
</html>
